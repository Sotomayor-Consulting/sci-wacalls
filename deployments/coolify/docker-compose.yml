# Despliegue del motor en Coolify (probado contra v4.3.23).
#
# Create Resource -> Docker Compose, origen Git, "Compose Path":
#   deployments/coolify/docker-compose.yml
#
# Dos detalles no opcionales, iguales a cualquier PaaS con proxy propio:
#
# 1. El puerto HTTP va con `expose`, NO publicado en el host: el proxy de
#    Coolify alcanza al servicio por su red interna. Sin esta línea el síntoma
#    es 404 en TODAS las rutas del dominio asignado, incluidas las que sí
#    existen (/widget.js, /api/sessions) — el proxy nunca llega a preguntarle
#    nada al proceso, así que ni siquiera es un error de nuestro código.
# 2. El puerto de MEDIOS sí se publica de verdad. El audio es UDP directo
#    navegador<->motor y el proxy de Coolify no enruta UDP: sin este mapeo (y
#    sin abrirlo en el firewall del proveedor) la llamada conecta y no se
#    escucha nada, sin error en los logs.
#
# Red: se une explícitamente a `coolify`, la red que el propio proxy de
# Coolify usa para llegar a los contenedores que administra (confirmado con
# `docker network ls` en el server: existe con ese nombre exacto, sin prefijo).
# No es una red "custom" nueva — es LA MISMA a la que Coolify ya conecta este
# contenedor por detrás para que el dominio funcione; declararla acá solo la
# hace explícita y estable ante un redeploy, en vez de depender de un ajuste de
# la UI.
#
# Se abandonó el enfoque de "Connect to Predefined Network" (Configuration >
# Advanced) documentado para versiones más nuevas: en la 4.3.23, para un
# recurso tipo Application esa opción no existe en la UI — la sección
# "Networking" del sidebar solo tiene Ports exposes / Port mappings / Network
# aliases, nada de toggle de red compartida.
#
# Para que Chatwoot (otro recurso en el mismo Coolify) sea alcanzable acá,
# declarar la MISMA red `coolify: external: true` en su propio compose, y
# referenciarlo por su nombre de servicio/contenedor — NUNCA por el dominio
# público (el dominio es para el navegador; tráfico entre contenedores del
# mismo servidor por su dominio puede fallar por hairpin NAT).
services:
  wacalls:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: always
    environment:
      - WACALLS_API_KEY=${WACALLS_API_KEY}
      # Clave ACOTADA para widget.js: queda visible en el DOM de los agentes.
      # Nunca poner acá la maestra.
      - WACALLS_WIDGET_KEY=${WACALLS_WIDGET_KEY}
      - WACALLS_MAX_CALLS=${WACALLS_MAX_CALLS:-8}
      # IP PÚBLICA del host, no la de Docker: es la que el motor le anuncia al
      # navegador como destino del audio.
      - WACALLS_PUBLIC_IP=${WACALLS_PUBLIC_IP}
      - WACALLS_UDP_PORT=${WACALLS_UDP_PORT:-50000}
      # Nombre de servicio/contenedor de Chatwoot en Coolify (ver comentario
      # de arriba), NUNCA su dominio público. Esquema http://, sin TLS: el
      # motor no lo termina.
      - WACALLS_CHATWOOT_URL=${WACALLS_CHATWOOT_URL}
      - WACALLS_CHATWOOT_ACCOUNT_ID=${WACALLS_CHATWOOT_ACCOUNT_ID}
      - WACALLS_CHATWOOT_TOKEN=${WACALLS_CHATWOOT_TOKEN}
      - WACALLS_CHATWOOT_INBOX_ID=${WACALLS_CHATWOOT_INBOX_ID}
      - WACALLS_CHATWOOT_INBOX_IDENTIFIER=${WACALLS_CHATWOOT_INBOX_IDENTIFIER}
      - WACALLS_CHATWOOT_SESSION=${WACALLS_CHATWOOT_SESSION:-inbox-b}
      # Grabación de llamadas. Vacío = manda el toggle por API. Con un número
      # real, revisar el requisito legal de consentimiento antes de activarla.
      - WACALLS_RECORDING=${WACALLS_RECORDING:-}
    expose:
      - '8080'
    ports:
      - '${WACALLS_UDP_PORT:-50000}:${WACALLS_UDP_PORT:-50000}/udp'
    volumes:
      - wacalls_data:/data
    networks:
      - coolify

volumes:
  wacalls_data:

networks:
  coolify:
    external: true
